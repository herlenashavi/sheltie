[package]
name = "sheltie"
version = "0.1.0"
edition = "2024"
description = "Herd your SSM sessions: one command to reach EC2 shells, RDS and private EKS through AWS Systems Manager"
license = "MIT"
repository = "https://github.com/herlenashavi/sheltie"

[dependencies]
anyhow = "1"
clap = { version = "4.5", features = ["derive"] }
libc = "0.2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
signal-hook = "0.3"
toml = "0.8"
